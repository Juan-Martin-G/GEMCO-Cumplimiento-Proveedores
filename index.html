<!doctype html>
<html lang="es-CL">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- El login solo puede conectarse a EmailJS (envío del código). -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' file:; script-src 'self' file: https://cdn.jsdelivr.net; style-src 'self' file: 'unsafe-inline'; img-src 'self' file: data:; connect-src https://api.emailjs.com; form-action 'none'; base-uri 'none'; object-src 'none'">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex, nofollow">
  <title>Ingreso · Cumplimiento de proveedores GEMCO</title>
  <link rel="stylesheet" href="styles.css">
  <script defer src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4.4.1/dist/email.min.js" integrity="sha384-SALc35EccAf6RzGw4iNsyj7kTPr33K7RoGzYu+7heZhT8s0GZouafRiCg1qy44AS" crossorigin="anonymous"></script>
  <script defer src="login.js"></script>
</head>
<body class="login-body">
  <main class="login-card">
    <div class="login-brand">
      <span class="logo" aria-hidden="true">G</span>
      <h1>Cumplimiento de proveedores</h1>
      <p class="muted">Acceso restringido · ingresa con tu correo autorizado</p>
    </div>

    <form id="paso1" class="login-paso" novalidate>
      <label for="in-email">Correo</label>
      <input id="in-email" type="email" placeholder="nombre@empresa.cl" autocomplete="email" required>
      <button type="submit" class="btn btn-ancho" id="btn-enviar">Enviar código</button>
      <p class="login-msg" id="msg1" role="status" aria-live="polite" hidden></p>
    </form>

    <form id="paso2" class="login-paso" novalidate hidden>
      <p class="login-eco">Código enviado a <strong id="email-eco"></strong></p>
      <label for="in-codigo">Código de 6 dígitos</label>
      <input id="in-codigo" class="login-codigo" type="text" inputmode="numeric" maxlength="6" placeholder="······" autocomplete="one-time-code" required>
      <button type="submit" class="btn btn-ancho" id="btn-ingresar">Ingresar</button>
      <div class="login-links">
        <button type="button" class="link-sec" id="btn-volver">Volver a ingresar correo</button>
        <button type="button" class="link-sec" id="btn-reenviar">Reenviar código</button>
      </div>
      <p class="login-msg" id="msg2" role="status" aria-live="polite" hidden></p>
    </form>
  </main>
</body>
</html>
